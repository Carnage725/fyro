name: Release

# Push a tag like v0.1.0 to publish. Publishing uses PyPI Trusted Publishing:
# no API token is stored anywhere (see docs/releasing.md for the one-time setup).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Tag must match the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build --no-sources
      - name: Install the built wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl -- python -c "import fyro, fyro.admin"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv publish --trusted-publishing always
